<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survey</title>
  <link rel="stylesheet" href="style/cssWebDesign.css">
</head>
<body>

  <!-- Logo Banner -->
  <div class="logo-container">
    <div class="logo-box">
      <span class="logo-m">M</span>
      <span class="logo-text">MURACH</span>
    </div>
  </div>

  <main class="container">
    <h1>Survey</h1>
    <p class="intro-text">If you have a moment, we'd appreciate it if you would fill out this survey.</p>

    <form id="surveyForm">
      <!-- Section 1: Personal Info -->
      <h2>Your information:</h2>
      
      <div class="form-group">
        <label for="firstName">First Name</label>
        <input type="text" id="firstName" name="firstName" required>
      </div>

      <div class="form-group">
        <label for="lastName">Last Name</label>
        <input type="text" id="lastName" name="lastName" required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="dob">Date of Birth</label>
        <input type="text" id="dob" name="dob">
      </div>

      <!-- Section 2: Referral Source -->
      <h2>How did you hear about us?</h2>
      <div class="radio-group">
        <label><input type="radio" name="source" value="Search engine" checked> Search engine</label>
        <label><input type="radio" name="source" value="Word of mouth"> Word of mouth</label>
        <label><input type="radio" name="source" value="Social Media"> Social Media</label>
        <label><input type="radio" name="source" value="Other"> Other</label>
      </div>

      <!-- Section 3: Announcements -->
      <h2>Would you like to receive announcements<br>about new CDs and special offers?</h2>
      
      <div class="checkbox-group">
        <label><input type="checkbox" id="announcements" name="announcements" value="Yes"> YES, I'd like that.</label>
      </div>

      <div class="checkbox-group">
        <label><input type="checkbox" id="email_announcements" name="email_announcements" value="Yes"> YES, please send me email announcements.</label>
      </div>

      <div class="select-group">
        <label for="contact-method">Please contact me by:</label>
        <select id="contact-method" name="contact-method">
          <option value="Email or postal mail">Email or postal mail</option>
          <option value="Email">Email</option>
          <option value="Postal mail">Postal mail</option>
        </select>
      </div>

      <div class="button-group">
        <button type="submit">Submit</button>
      </div>
    </form>
  </main>

  <script>
    document.getElementById('surveyForm').addEventListener('submit', function(e) {
      e.preventDefault();

      // Thu thập dữ liệu nhập vào
      const formData = {
        firstName: document.getElementById('firstName').value,
        lastName: document.getElementById('lastName').value,
        email: document.getElementById('email').value,
        dob: document.getElementById('dob').value,
        source: document.querySelector('input[name="source"]:checked')?.value || '',
        announcements: document.getElementById('announcements').checked ? 'Yes' : 'No',
        emailAnnouncements: document.getElementById('email_announcements').checked ? 'Yes' : 'No',
        contactMethod: document.getElementById('contact-method').value
      };

      // Lưu vào localStorage và chuyển sang trang thanks.html
      localStorage.setItem('surveyData', JSON.stringify(formData));
      window.location.href = 'thanks.html';
    });
  </script>
</body>
</html>
